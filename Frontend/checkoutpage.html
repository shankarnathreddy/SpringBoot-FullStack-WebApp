<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">
  <title>Spicy5 Checkout</title>
  <link rel="stylesheet" href="checkoutpage.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="checkout-container">
  <h1>Details</h1>
  <form id="checkoutForm">

    <!-- NAME -->
    <div class="input-box">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name"><small id="nameError"></small>
    </div>

    <!-- MOBILE -->
    <div class="input-box">
      <label>Mobile Number</label>
      <input type="text" id="mobile" placeholder="Enter mobile number"><small id="mobileError"></small>
    </div>

    <!-- STATE -->
    <div class="input-box">
      <label>Select State</label>
      <select id="state">
        <option value="">Choose State</option>
        <option>Andhra Pradesh</option>
        <option>Telangana</option>
        <option>Tamil Nadu</option>
        <option>Karnataka</option>
        <option>Kerala</option>
      </select>
      <small id="stateError"></small>
    </div>

    <!-- CITY -->
    <div class="input-box">
      <label>Select City</label>
      <select id="city">
        <option value="">Choose City</option>
        <option>Hyderabad</option>
        <option>Vijayawada</option>
        <option>Guntur</option>
        <option>Vizag</option>
        <option>Tirupati</option>
        <option>Warangal</option>
      </select>
      <small id="cityError"></small>
    </div>

    <!-- ADDRESS -->
    <div class="input-box">
      <label>Address</label>
      <textarea id="address" placeholder="Enter full address"></textarea><small id="addressError"></small>
    </div>

    <!-- PINCODE -->
    <div class="input-box">
      <label>Pincode</label>
      <input type="text" id="pincode" placeholder="Enter pincode"><small id="pincodeError"></small>
    </div>

    <!-- BUTTON -->
    <button type="submit" class="place-btn">Place Order</button>
  </form>
</div>
<script src="checkoutpage.js"></script>
</body>
</html>
